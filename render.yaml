services:
  - type: web
    name: toolxw-control
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 bot_render:app
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SERVER_SECRET
        sync: false
      - key: DB_PATH
        value: /var/data/control.db
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: toolxw-data
      mountPath: /var/data
      sizeGB: 1
