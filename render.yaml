services:
  - type: web
    name: toolxw-file-lock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_render.py
    envVars:
      - key: PORT
        value: "10000"
      - key: SERVER_SECRET
        sync: false
      - key: DB_PATH
        value: "data/toolxw_files.db"
